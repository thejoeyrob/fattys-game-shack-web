name: Publish browser build

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the newest browser build
        run: |
          curl -fsSL -o web.zip "https://github.com/thejoeyrob/ZC-Zombie-Smash/releases/download/quest-latest/FattysGameShack-Web.zip"
          mkdir site && unzip -q web.zip -d site
          cp site/index.html site/404.html || true
          cat site/build.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
